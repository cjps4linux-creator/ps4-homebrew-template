name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest==8.3.3
      - name: Verify package identity is consistent
        run: pytest -q --no-header

  build-check:
    name: Source compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Syntax check src/main.cpp
        # The OpenOrbis toolchain is not redistributable, so CI cannot produce a
        # real eboot.bin. It can still prove the source is valid C++ and free of
        # warnings, which is the part most likely to regress.
        run: clang++ -fsyntax-only -Wall -Wextra -std=c++17 src/main.cpp

  docs-check:
    name: Docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          for f in README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md LICENSE; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "docs present"
